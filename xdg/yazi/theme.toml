[mgr]
cwd = { fg = "#5fd7ff", bold = true }
hovered = { fg = "#ffffff", bg = "#303030" }
preview_hovered = { fg = "#ffffff", bg = "#303030" }
find_keyword = { fg = "#ffd75f", bold = true }
find_position = { fg = "#d787ff", italic = true }

marker_copied = { fg = "#87d787", bg = "#87d787" }
marker_cut = { fg = "#ff5f5f", bg = "#ff5f5f" }
marker_marked = { fg = "#5fd7ff", bg = "#5fd7ff" }
marker_selected = { fg = "#ffd75f", bg = "#ffd75f" }

count_copied = { fg = "#000000", bg = "#87d787" }
count_cut = { fg = "#000000", bg = "#ff5f5f" }
count_selected = { fg = "#000000", bg = "#ffd75f" }

border_symbol = "│"
border_style = { fg = "#444444" }

[tabs]
active = { fg = "#000000", bg = "#5fd7ff", bold = true }
inactive = { fg = "#a8a8a8", bg = "#1c1c1c" }

[mode]
normal_main = { fg = "#000000", bg = "#5fd7ff", bold = true }
normal_alt = { fg = "#d0d0d0", bg = "#1c1c1c" }

select_main = { fg = "#000000", bg = "#87d787", bold = true }
select_alt = { fg = "#d0d0d0", bg = "#1c1c1c" }

unset_main = { fg = "#000000", bg = "#ff5f5f", bold = true }
unset_alt = { fg = "#d0d0d0", bg = "#1c1c1c" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "#666666" }
perm_type = { fg = "#5fd7ff" }
perm_read = { fg = "#87d787" }
perm_write = { fg = "#ffd75f" }
perm_exec = { fg = "#ff5f5f" }

progress_label = { fg = "#d0d0d0", bold = true }
progress_normal = { fg = "#5fd7ff", bg = "#1c1c1c" }
progress_error = { fg = "#ff5f5f", bg = "#1c1c1c" }

[input]
border = { fg = "#303030", bg = "#303030" }
title = { fg = "#a8a8a8", bg = "#303030" }
value = { fg = "#d0d0d0", bg = "#303030" }
selected = { fg = "#000000", bg = "#a8a8a8" }

[completion]
border = { fg = "#303030", bg = "#303030" }
active = { fg = "#d0d0d0", bg = "#1c1c1c" }

[tasks]
border = { fg = "#444444" }
title = {}
hovered = { fg = "#d0d0d0", bg = "#1c1c1c" }

[which]
mask = { bg = "#000000" }
cand = { fg = "#5fd7ff" }
rest = { fg = "#a8a8a8" }
desc = { fg = "#d0d0d0" }
separator = "  "
separator_style = { fg = "#666666" }

[help]
on = { fg = "#5fd7ff" }
run = { fg = "#87d787" }
desc = { fg = "#a8a8a8" }
hovered = { bg = "#1c1c1c", bold = true }
footer = { fg = "#000000", bg = "#d0d0d0" }

[notify]
title_info = { fg = "#5fd7ff" }
title_warn = { fg = "#ffd75f" }
title_error = { fg = "#ff5f5f" }

[filetype]
rules = [
  { mime = "image/*", fg = "#d787ff" },
  { mime = "video/*", fg = "#d787ff" },
  { mime = "audio/*", fg = "#87d787" },
  { mime = "application/zip", fg = "#ffd75f" },
  { mime = "application/gzip", fg = "#ffd75f" },
  { mime = "application/x-tar", fg = "#ffd75f" },
  { mime = "application/x-bzip", fg = "#ffd75f" },
  { mime = "application/x-bzip2", fg = "#ffd75f" },
  { mime = "application/x-7z-compressed", fg = "#ffd75f" },
  { mime = "application/x-rar", fg = "#ffd75f" },
  { mime = "application/pdf", fg = "#ff5f5f" },
  { mime = "application/vnd.*", fg = "#87d787" },
  { name = "*/", fg = "#5fd7ff" },
  { name = "*", fg = "#d0d0d0" }
]

[preview]
bat_theme = "ansi"
